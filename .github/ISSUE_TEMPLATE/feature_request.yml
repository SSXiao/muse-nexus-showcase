name: 功能建议 / Feature request
description: 描述想解决的问题或希望改善的使用流程。
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 你在什么任务中遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议 / Suggestion
      description: 希望工具如何帮助你完成这项任务？
    validations:
      required: true
